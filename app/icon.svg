<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Flexiple Sourcing">
  <!-- Solid vermillion ground: the accent is the one colour carried through the
       whole interface, and a filled tile survives 16px far better than a mark
       floating on paper. -->
  <rect width="32" height="32" fill="#b4400f"/>
  <!-- Serif F drawn as paths, not set as text: an SVG favicon renders with
       system fonts, so a font-family reference would differ on every machine
       and disappear entirely where the face is missing. Stroke weights are
       tuned so the two counters stay open at 16px. -->
  <g fill="#f7f1e8">
    <!-- stem -->
    <rect x="13.1" y="6" width="3.6" height="20"/>
    <!-- top arm and its downturned terminal -->
    <rect x="13.1" y="6" width="10.6" height="3.3"/>
    <rect x="21.6" y="9.3" width="2.1" height="1.7"/>
    <!-- middle arm, set slightly shorter so the F does not read as an E -->
    <rect x="13.1" y="14.1" width="7.6" height="3.1"/>
    <!-- foot serif, ~2.6x the stem and centred on it -->
    <rect x="10.2" y="23.4" width="9.4" height="2.6"/>
  </g>
</svg>
